name: Feature request / Предложение
description: Suggest a feature or improvement.
title: '[Feature] '
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to improve? / Что хотите улучшить?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use case / Сценарий использования
      description: Do not include subscription URLs or server credentials.
